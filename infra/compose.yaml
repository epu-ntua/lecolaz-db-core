name: ${COMPOSE_PROJECT_NAME:-lecolaz}

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecolaz}
      POSTGRES_USER: ${POSTGRES_USER:-lecolaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecolaz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lecolaz}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lecolaz123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  fuseki:
    # TODO: compose.prod.yaml has no fuseki service yet.
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-lecolaz}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-lecolaz}
      TDB: "2"
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki_data:/fuseki

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - minio
      - fuseki
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
  minio_data:
  fuseki_data: