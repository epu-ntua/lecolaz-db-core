name: ${COMPOSE_PROJECT_NAME:-lecolaz}

x-dagster-common: &dagster-common
  image: ${DAGSTER_IMAGE_NAME:-lecolaz-dagster:1.13.23}
  build:
    context: ..
    dockerfile: infra/dagster/Dockerfile
  env_file:
    - ../backend/.env
  environment:
    DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
    DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-dagster}
    DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    LECOLAZ_POSTGRES_HOST: postgres
    LECOLAZ_POSTGRES_PORT: "5432"
    LECOLAZ_POSTGRES_DB: ${POSTGRES_DB:-lecolaz}
    LECOLAZ_POSTGRES_USER: ${POSTGRES_USER:-lecolaz}
    LECOLAZ_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecolaz}
    HAMAPI_API_KEY: ${HAMAPI_API_KEY:-}
    HAMAPI_INGESTION_DELAY_HOURS: ${HAMAPI_INGESTION_DELAY_HOURS:-4}
    OPENMETEO_INGESTION_DELAY_HOURS: ${OPENMETEO_INGESTION_DELAY_HOURS:-4}
  volumes:
    - dagster_storage:/opt/dagster/storage
  restart: unless-stopped

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecolaz}
      POSTGRES_USER: ${POSTGRES_USER:-lecolaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecolaz}
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-dagster}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/010-init.sql:ro
      - ./postgres/init-dagster.sh:/docker-entrypoint-initdb.d/020-init-dagster.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lecolaz}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lecolaz123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-lecolaz}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-lecolaz}
      TDB: "2"
      FUSEKI_URL: http://localhost:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-lecolaz}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-lecolaz}
      SCHEMA_GRAPH: https://w3id.org/lecolaz/graph/schema
      SCHEMA_FILE: le_colaz_ontology_schema.ttl
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki_data:/fuseki
      - ./fuseki/load-schema.sh:/init/load-schema.sh:ro
      - ../resources/ontology:/init/schema:ro
    # Loads the ontology schema each time Compose starts this container.
    # `|| echo` keeps a failed load from marking fuseki as failed, which would
    # stop Compose from starting the backend (depends_on: fuseki).
    post_start:
      - command:
          - bash
          - -c
          - 'bash /init/load-schema.sh || echo "Schema load failed, continuing without it"'

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - minio
      - fuseki
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
      # Read by POST /ontology/schema/reload (LECO_SCHEMA_PATH).
      - ../resources/ontology:/resources/ontology:ro

  dagster-code:
    <<: *dagster-common
    post_start:
      - command: ["python", "-m", "infra.dagster.initialize"]
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  dagster-webserver:
    <<: *dagster-common
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    ports:
      - "127.0.0.1:${DAGSTER_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:3000/server_info', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      dagster-code:
        condition: service_healthy

  dagster-daemon:
    <<: *dagster-common
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      dagster-code:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  fuseki_data:
  dagster_storage:
