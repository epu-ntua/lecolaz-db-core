# differences from dev
# DEV                         PROD
# ------------------------------------------------
# --reload                    no --reload
# backend bind mount          no bind mount (only read-only resources/ontology)
# DB port exposed             DB not exposed
# MinIO ports exposed         MinIO not exposed
# Fuseki port exposed         Fuseki not exposed
# normal restart              restart unless-stopped
# name: ${COMPOSE_PROJECT_NAME:-lecolaz-prod}

# Le'Colaz — Production Docker Compose
# Caddy currently configured for local HTTP testing on localhost:8082.
# Public HTTPS will be configured during production migration.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?DAGSTER_POSTGRES_PASSWORD must be set}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/init-dagster.sh:/docker-entrypoint-initdb.d/020-init-dagster.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?FUSEKI_ADMIN_PASSWORD must be set}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-lecolaz}
      TDB: "2"
      FUSEKI_URL: http://localhost:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-lecolaz}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?FUSEKI_ADMIN_PASSWORD must be set}
      SCHEMA_GRAPH: https://w3id.org/lecolaz/graph/schema
      SCHEMA_FILE: le_colaz_ontology_schema.ttl
    volumes:
      - fuseki_data:/fuseki
      - ./fuseki/load-schema.sh:/init/load-schema.sh:ro
      - ../resources/ontology:/init/schema:ro
    post_start:
      - command:
          - bash
          - -c
          - 'bash /init/load-schema.sh || echo "Schema load failed, continuing without it"'
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      HAMAPI_API_KEY: ${HAMAPI_API_KEY:-}
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/graphql
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      fuseki:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../resources/ontology:/resources/ontology:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - portainer
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:sts
    command:
      - -H
      - unix:///var/run/docker.sock
      - --base-url=/portainer
      - --http-enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"
    restart: unless-stopped

  dagster-code:
    extends:
      file: compose.yaml
      service: dagster-code
    environment:
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?DAGSTER_POSTGRES_PASSWORD must be set}

  dagster-webserver:
    extends:
      file: compose.yaml
      service: dagster-webserver
    environment:
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?DAGSTER_POSTGRES_PASSWORD must be set}

  dagster-daemon:
    extends:
      file: compose.yaml
      service: dagster-daemon
    environment:
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:?DAGSTER_POSTGRES_PASSWORD must be set}

volumes:
  postgres_data:
  minio_data:
  fuseki_data:
  dagster_storage:
  portainer_data:
  caddy_data:
  caddy_config: