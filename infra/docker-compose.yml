name: lecolaz

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: lecolaz-postgres
    environment:
      POSTGRES_DB: lecolaz
      POSTGRES_USER: lecolaz
      POSTGRES_PASSWORD: lecolaz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: lecolaz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lecolaz
      MINIO_ROOT_PASSWORD: lecolaz123
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ../backend
    container_name: lecolaz-backend
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app

  nifi:
    build: ./nifi
    container_name: lecolaz-nifi
    depends_on:
      - postgres
    env_file:
      - ./.env
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: lecolaz-nifi-admin
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/lecolaz
    ports:
      - "8443:8443"
    volumes:
      - ../backend:/opt/lecolaz/backend:ro
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state

volumes:
  postgres_data:
  minio_data:
  nifi_conf:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
